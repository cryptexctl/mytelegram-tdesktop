name: Build macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install dependencies
      run: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        brew install git automake cmake wget pkg-config gnu-tar ninja nasm meson
        
    - name: Setup Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        
    - name: Prepare libraries
      run: |
        cd Telegram
        ./build/prepare/mac.sh
        
    - name: Configure build
      run: |
        cd Telegram
        ./configure.sh -D TDESKTOP_API_ID=1337 -D TDESKTOP_API_HASH=f9867s0
        
    - name: Build with Xcode
      run: |
        cd out
        xcodebuild -project Telegram.xcodeproj -scheme Telegram -configuration Release build
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-macOS
        path: out/Telegram.app
